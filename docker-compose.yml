services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/omniva_db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for production}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5000
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
    depends_on:
      - mongo

  mongo:
    image: mongo:7-jammy
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
